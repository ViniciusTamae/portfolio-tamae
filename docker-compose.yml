services:
  # Ambiente de produção: build estático servido via Nginx.
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        BASE_PATH: /
    ports:
      - "8080:80"
    restart: unless-stopped

  # Ambiente de desenvolvimento: Vite com hot reload.
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: ["npm", "run", "dev", "--", "--host"]
    profiles:
      - dev
